name: aurelia-hotel-management

x-spring-service: &spring-service
  env_file: .env
  networks: [hotel-network]
  restart: on-failure:3

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["${NGINX_PORT:-80}:80"]
    volumes: ["./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      frontend-customer: {condition: service_healthy}
      frontend-staff: {condition: service_healthy}
      api-gateway: {condition: service_healthy}
    networks: [hotel-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend-customer:
    build:
      context: ./frontend-customer
      args: {VITE_API_BASE_URL: /api, VITE_BASE_PATH: /}
    networks: [hotel-network]
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend-staff:
    build:
      context: ./frontend-staff
      args: {VITE_API_BASE_URL: /api, VITE_BASE_PATH: /staff/}
    networks: [hotel-network]
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  api-gateway:
    <<: *spring-service
    build: ./services/api-gateway
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: docker
      AUTH_SERVICE_URL: http://auth-service:8080
      BOOKING_SERVICE_URL: http://booking-service:8080
      ROOM_SERVICE_URL: http://room-service:8080
      HOUSEKEEPING_SERVICE_URL: http://housekeeping-service:8080
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
    depends_on:
      auth-service: {condition: service_healthy}
      booking-service: {condition: service_healthy}
      room-service: {condition: service_healthy}
      housekeeping-service: {condition: service_healthy}
      maintenance-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}
    healthcheck: &spring-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 6

  auth-service:
    <<: *spring-service
    build: ./services/auth-service
    ports: ["${AUTH_SERVICE_PORT:-8081}:8080"]
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on: {mysql: {condition: service_healthy}, redis: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}, minio-init: {condition: service_completed_successfully}}
    healthcheck: *spring-healthcheck

  booking-service:
    <<: *spring-service
    build: ./services/booking-service
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: booking_user
      SPRING_DATASOURCE_PASSWORD: ${BOOKING_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on: {mysql: {condition: service_healthy}, redis: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}, minio-init: {condition: service_completed_successfully}}
    healthcheck: *spring-healthcheck

  room-service:
    <<: *spring-service
    build: ./services/room-service
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/room_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: room_user
      SPRING_DATASOURCE_PASSWORD: ${ROOM_DB_PASSWORD}
    depends_on: {mysql: {condition: service_healthy}, redis: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}, minio-init: {condition: service_completed_successfully}}
    healthcheck: *spring-healthcheck

  housekeeping-service:
    <<: *spring-service
    build: ./services/housekeeping-service
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/housekeeping_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: housekeeping_user
      SPRING_DATASOURCE_PASSWORD: ${HOUSEKEEPING_DB_PASSWORD}
    depends_on: {mysql: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}}
    healthcheck: *spring-healthcheck

  maintenance-service:
    <<: *spring-service
    build: ./services/maintenance-service
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/maintenance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: maintenance_user
      SPRING_DATASOURCE_PASSWORD: ${MAINTENANCE_DB_PASSWORD}
    depends_on: {mysql: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}, minio-init: {condition: service_completed_successfully}}
    healthcheck: *spring-healthcheck

  notification-service:
    <<: *spring-service
    build: ./services/notification-service
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: notification_user
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    depends_on: {mysql: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}}
    healthcheck: *spring-healthcheck

  mysql:
    image: mysql:8.4
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ONETIME_PASSWORD: "false"
    ports: ["${MYSQL_PORT:-3306}:3306"]
    volumes: ["mysql-data:/var/lib/mysql", "./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro"]
    networks: [hotel-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: ["redis-data:/data"]
    networks: [hotel-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["${KAFKA_PORT:-9092}:29092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    networks: [hotel-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      start_period: 40s
      retries: 10

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on: {kafka: {condition: service_healthy}}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        for topic in booking.created booking.confirmed booking.cancelled guest.checked-in guest.checked-out payment.completed room.status.changed housekeeping.task.created housekeeping.task.completed maintenance.created maintenance.resolved; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1;
        done
    networks: [hotel-network]
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address :9001
    ports: ["${MINIO_API_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["minio-data:/data"]
    networks: [hotel-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  minio-init:
    image: amazon/aws-cli:2.36.44
    env_file: .env
    depends_on: {minio: {condition: service_healthy}}
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        for bucket in hotel-images room-images maintenance-images documents invoices; do
          aws --endpoint-url http://minio:9000 s3api create-bucket --bucket "$$bucket" 2>/dev/null || true;
        done
    networks: [hotel-network]
    restart: "no"

networks:
  hotel-network: {name: hotel-network}

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  minio-data:
